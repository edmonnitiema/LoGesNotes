<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Concept : un cahier d'écolier. Papier bleuté, encre bleue, marge et corrections en rouge.
   Mobile d'abord : navigation en bas, saisie rapide, tableaux qui défilent sur le côté. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --surface-2:#f4f6fb; --ink:#13203f; --ink-2:#506082;
  --line:#d5dcec; --accent:#2a4bd0; --accent-ink:#ffffff; --red:#c4302b; --green:#17794a;
  --warn-bg:#fdecea; --ok-bg:#e5f4ec; --rule:#dde5f6; --margin:#e5736b;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --surface:#151d31; --surface-2:#1b2540; --ink:#e7ecf8; --ink-2:#9ba8c8;
    --line:#2a3759; --accent:#86a0ff; --accent-ink:#0e1424; --red:#ff857d; --green:#6fd3a0;
    --warn-bg:#3a1f23; --ok-bg:#153226; --rule:#212d4b; --margin:#8c4a50; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#151d31; --surface-2:#1b2540; --ink:#e7ecf8; --ink-2:#9ba8c8;
  --line:#2a3759; --accent:#86a0ff; --accent-ink:#0e1424; --red:#ff857d; --green:#6fd3a0;
  --warn-bg:#3a1f23; --ok-bg:#153226; --rule:#212d4b; --margin:#8c4a50; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-block:0 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
.wrap{max-width:880px; margin-inline:auto}
h1,h2,h3{font-family:var(--f-display); font-weight:700; line-height:1.15; text-wrap:balance; margin:0}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}

/* En-tête */
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; padding-block:8px 12px}
.brand{display:flex; align-items:center; gap:12px; flex:1 1 260px; min-width:0}
.brand>div:last-child{flex:1 1 0; min-width:0}
.circ{margin:0; padding-top:14px; font-size:.75rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2); text-wrap:balance; user-select:none; -webkit-user-select:none}
.mark{border:0; padding:0; cursor:pointer; flex:none; width:40px; height:40px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center}
.mark svg{width:22px; height:22px}
.mark img{width:100%; height:100%; display:block; border-radius:8px}
.top h1{font-size:1.25rem; overflow-wrap:break-word; word-break:normal}
.top .sub{color:var(--ink-2); font-size:.875rem; overflow-wrap:anywhere}
.status{flex:none; font-size:.8125rem; color:var(--ink-2); display:flex; align-items:center; gap:6px; text-align:right}
.status i{width:8px; height:8px; border-radius:50%; background:var(--ink-2); display:inline-block}
.status.ok i{background:var(--green)} .status.bad i{background:var(--red)}
.status.bad{color:var(--red)}

/* Navigation */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; gap:2px;
  background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));
}
.tabs button{
  flex:1; min-width:0; background:none; border:0; border-radius:8px; padding:4px 2px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.75rem; color:var(--ink-2); font-weight:400;
}
.tabs svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent); font-weight:700}
.tabs button[aria-current="page"] svg{background:color-mix(in srgb,var(--accent) 16%,transparent); border-radius:8px; padding:2px; width:28px; height:28px; margin-block:-2px}
@media (min-width:820px){
  body{padding-block:0 48px}
  .tabs{position:sticky; top:env(safe-area-inset-top,0px); bottom:auto; max-width:880px; margin:0 auto; border:1px solid var(--line); border-radius:10px; padding:4px}
  .tabs button{flex-direction:row; justify-content:center; gap:8px; font-size:.9375rem; padding:8px}
  .tabs button[aria-current="page"] svg{background:none; padding:0; width:24px; height:24px; margin:0}
  .tabs button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,transparent)}
}

/* Contenu */
main{padding-block:18px 8px; display:flex; flex-direction:column; gap:28px}
section{display:flex; flex-direction:column; gap:12px; min-width:0}
h2{font-size:1.25rem}
h2 .n{color:var(--ink-2); font-weight:600; font-size:1rem; margin-left:6px}
.hint{color:var(--ink-2); font-size:.9375rem}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field label,.lbl{font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); font-weight:700}
input,select,textarea{
  width:100%; min-width:0; min-height:44px; padding:8px 10px; background:var(--surface); border:1px solid var(--line); border-radius:6px;
}
textarea{min-height:110px; resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent); outline-offset:1px}
.grid2{display:grid; grid-template-columns:1fr; gap:12px}
@media (min-width:560px){.grid2{grid-template-columns:1fr 1fr}}

.btn{
  min-height:44px; padding:8px 16px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.btn.ghost{background:transparent; color:var(--accent)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.armed,.icon-btn.armed{background:var(--red); border-color:var(--red); color:var(--surface)}
.icon-btn{
  flex:none; min-width:44px; min-height:44px; padding:0 8px; display:inline-grid; place-items:center; cursor:pointer;
  background:transparent; border:1px solid transparent; border-radius:6px; color:var(--ink-2); font-weight:700; font-size:.875rem;
}
.icon-btn:hover{border-color:var(--line)}
.icon-btn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.actions{display:flex; flex-wrap:wrap; gap:10px}

/* Listes saisies */
.addrow{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.addrow .full{grid-column:1/-1}
@media (min-width:640px){.addrow{grid-template-columns:2fr 1fr 90px auto}.addrow .full{grid-column:auto}.addrow.two{grid-template-columns:2fr 1fr auto}.addrow.one{grid-template-columns:1fr auto}}
.list{display:flex; flex-direction:column; border-top:1px solid var(--line)}
.srow{display:grid; grid-template-columns:1fr 68px 68px 44px; gap:8px; padding-block:6px; border-bottom:1px solid var(--line); align-items:center}
.shead{display:grid; grid-template-columns:1fr 68px 68px 44px; gap:8px; padding-top:4px}
.drow{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding-block:10px; border-bottom:1px solid var(--line)}
.drow .nm{flex:1 1 100%}
.drow .mini{display:flex; align-items:center; gap:6px; font-size:.9375rem}
.drow .mini input,.drow .mini select{width:76px}
.drow .sp{flex:1}
details{border:1px solid var(--line); border-radius:6px; background:var(--surface)}
summary{padding:12px; cursor:pointer; font-weight:700; min-height:44px}
details>div{padding:0 12px 12px; display:flex; flex-direction:column; gap:10px}
.banner{background:var(--warn-bg); border:1px solid var(--line); border-radius:6px; padding:12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.banner p{flex:1 1 240px}

/* Présentation de départ */
.intro{display:flex; flex-direction:column; gap:14px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.intro h2{font-size:1.625rem}
.steps{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px}

/* Saisie des notes */
.seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}
.seg button{flex:1; min-height:44px; background:none; border:0; border-right:1px solid var(--line); cursor:pointer; font-weight:700; color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.noterow{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; padding-block:6px; border-bottom:1px solid var(--line)}
.noterow .nm{overflow-wrap:anywhere}
.inwrap{display:flex; align-items:center; gap:6px}
.inwrap input{width:84px; text-align:right; font-variant-numeric:tabular-nums; font-weight:700}
.inwrap .of{color:var(--ink-2); width:34px; font-variant-numeric:tabular-nums}
.noterow .err{display:none; grid-column:1/-1; color:var(--red); font-size:.875rem; text-align:right}
.noterow.bad .err{display:block}
.noterow.bad input{border-color:var(--red); background:var(--warn-bg)}
.prog{font-size:.9375rem; color:var(--ink-2)}
.prog b{color:var(--ink)}

/* Résultats */
.strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:0}
.strip div{background:var(--surface); padding:10px 12px}
.strip dt{font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); font-weight:700}
.strip dd{margin:0; font-family:var(--f-display); font-size:1.375rem; font-weight:700; font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
th,td{padding:8px 10px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:.8125rem; background:var(--surface-2); font-weight:700; vertical-align:bottom}
th small{display:block; font-weight:400; color:var(--ink-2)}
th:first-child,td:first-child{text-align:left; position:sticky; left:0; background:var(--surface); z-index:1}
th:first-child{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.low{color:var(--red)}
td.avg{font-weight:700}
td.pass{color:var(--green)} td.fail{color:var(--red)}
.rk{display:inline-block; min-width:3.4em; font-weight:700; color:var(--accent)}
td.ap{text-align:left}
/* Informations des filles en rouge */
tr.girl td{color:var(--red)!important}
.srow.girl input,.srow.girl select{color:var(--red)}
.noterow.girl .nm{color:var(--red)}
.sheet.girl .ident dd,.sheet.girl .verdict .v{color:var(--red)}
.fcol{color:var(--red)!important}
.fait{text-align:right; font-weight:700}
.home h2{font-size:1.375rem; text-align:center}
.home .hint{text-align:center}
.btnlist{display:grid; grid-template-columns:1fr; gap:8px}
@media (min-width:560px){.btnlist{grid-template-columns:1fr 1fr}}
.bt{display:flex; align-items:center; gap:12px; text-align:left; min-height:56px; padding:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px; cursor:pointer}
.bt svg{flex:none; width:28px; height:28px; fill:none; stroke:var(--accent); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.bt span{display:flex; flex-direction:column; min-width:0}
.bt small{color:var(--ink-2); font-size:.875rem}
.box{border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--surface-2)}
.box ul{margin:6px 0 0; padding-left:20px}
.credit{margin-top:8px; border:2px solid var(--accent); border-radius:10px; padding:14px; text-align:center; background:var(--surface)}
.credit p{margin:2px 0}
.credit .ct{font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); font-weight:700}
.credit .nm{font-family:var(--f-display); font-size:1.25rem; font-weight:700}
.credit .tel{margin-top:8px; font-weight:700}
.bil input,.bil select{min-height:36px; width:72px; padding:4px 6px}
.bil td.prop{white-space:normal; min-width:150px}
tr.girl input,tr.girl select{color:var(--red)}
.tophead{display:grid; grid-template-columns:1.25fr 1fr; gap:10px; text-align:center; font-size:.6875rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; background:var(--surface); padding:6px; border-radius:4px}
.tophead p{margin:0; overflow-wrap:anywhere}
.tophead>div:last-child p:nth-child(2){text-transform:none; font-style:italic}

/* Bulletin (aperçu en feuille de cahier) */
.pick{display:grid; grid-template-columns:44px 1fr 44px; gap:8px; align-items:end}
.pick .icon-btn{border-color:var(--line); background:var(--surface)}
.sheet{
  position:relative; background-color:var(--surface); border:1px solid var(--line); border-radius:4px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);
  padding:20px 14px 20px 44px; display:flex; flex-direction:column; gap:14px; min-width:0;
}
.sheet::before{content:""; position:absolute; left:30px; top:0; bottom:0; width:2px; background:var(--margin)}
.sheet-head{text-align:center; display:flex; flex-direction:column; gap:2px}
.sheet-head h3{font-size:1.25rem; overflow-wrap:break-word; word-break:normal}
.sheet-head .c{font-size:.6875rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2); text-wrap:balance; margin-bottom:6px; user-select:none; -webkit-user-select:none}
.sheet-head .t{font-family:var(--f-display); font-weight:700; letter-spacing:.12em; font-size:.9375rem}
.sheet-head .p{color:var(--ink-2); font-size:.9375rem}
.ident{margin:0; display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; background:var(--surface); padding:8px 10px; border:1px solid var(--line); border-radius:4px}
.ident div{min-width:0; overflow-wrap:anywhere}
.ident dt{font-size:.6875rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); font-weight:700}
.ident dd{margin:0; font-weight:700}
.ident .wide{grid-column:1/-1}
.sheet .tbl-wrap{border-radius:4px}
.sheet th,.sheet td{padding:6px 5px; white-space:normal; font-size:.8125rem}
.sheet td:nth-child(2){white-space:nowrap}
.sheet .tbl-wrap td:first-child,.sheet .tbl-wrap th:first-child{text-align:left}
.sheet td.ap,.sheet th:last-child{text-align:left}
.sheet td:first-child,.sheet th:first-child{position:static}
tfoot td{font-weight:700; background:var(--surface-2); border-bottom:0}
.verdict{background:var(--surface); border:1px solid var(--line); border-radius:4px; display:grid; grid-template-columns:1fr 1fr; gap:0}
.verdict>div{padding:10px 12px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-width:0}
.verdict>div:nth-child(2n){border-right:0}
.verdict>div:nth-last-child(-n+2){border-bottom:0}
.verdict .k{font-size:.6875rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); font-weight:700}
.verdict .v{font-family:var(--f-display); font-weight:700; font-size:1.25rem; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.verdict .v.big{font-size:1.5rem; white-space:nowrap}
.warn{color:var(--red); font-size:.9375rem}
.empty{border:1px dashed var(--line); border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; background:var(--surface)}
.lock{max-width:440px; margin:6vh auto 0; display:flex; flex-direction:column; gap:14px}
.lock h2{font-size:1.75rem}
.lock form{display:flex; flex-direction:column; gap:10px}
.codein{width:100%; min-height:6em; font:12px/1.35 ui-monospace,Menlo,Consolas,monospace; word-break:break-all; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink)}
.devid{font-size:1.05rem; padding:10px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px}
.devid b{letter-spacing:.12em; font-variant-numeric:tabular-nums}
.pages{position:fixed; inset:0; z-index:50; background:var(--bg); overflow-y:auto; display:flex; flex-direction:column; gap:12px;
  padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px)); padding-right:max(12px,env(safe-area-inset-right,0px))}
.pages img{flex:none; width:100%; max-width:900px; margin-inline:auto; display:block; border:1px solid var(--line); background:#fff}
.pg-bar{position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:10px; align-items:center; width:100%; max-width:900px; margin-inline:auto; background:var(--bg); padding-block:4px}
.pg-bar p{flex:1 1 220px; font-size:.9375rem; color:var(--ink-2)}
.sign{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px 14px; font-size:.875rem}
.sign>div{display:flex; flex-direction:column; min-width:0}
.sign b{font-weight:700}
.sign .gap{min-height:44px; border-bottom:1px dotted var(--ink-2); margin-bottom:4px}
.sign span:last-child{overflow-wrap:break-word; min-height:1.4em}
tr.gen td{font-weight:700; background:var(--surface-2)}
th[colspan]{text-align:center; border-left:1px solid var(--line)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px; z-index:40; max-width:min(92vw,520px); font-size:.9375rem}
@media (min-width:820px){.toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

<script>
(function(){
'use strict';
var KEY='carnet-notes-v1';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var isNum=function(v){return typeof v==='number'&&isFinite(v)};
var fn=function(n){return n==null?'':String(Math.round(n*100)/100).replace('.',',')};
var f2=function(n){return n==null?'–':(Math.round(n*100)/100).toFixed(2).replace('.',',')};
var uid=function(){return Math.random().toString(36).slice(2,9)};
/* Licence : date d'expiration et mot de passe de prolongation (+1 an) */
var CIRC="CIRCONSCRIPTION D'ÉDUCATION DE BASE DE TANGHIN-DASSOURI I";
var LIC={expiry:'2027-09-30'};
var p2=function(n){return (n<10?'0':'')+n};
function todayStr(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function fmtDate(s){var a=String(s).split('-');return a[2]+'/'+a[1]+'/'+a[0]}
function effToday(){var t=todayStr(),ls=(S&&S.license&&S.license.lastSeen)||'';return ls>t?ls:t}
function isLocked(){return effToday()>S.license.until}
function daysLeft(){var a=effToday().split('-'),b=S.license.until.split('-');return Math.round((Date.UTC(+b[0],+b[1]-1,+b[2])-Date.UTC(+a[0],+a[1]-1,+a[2]))/864e5)}
function b64u(t){t=String(t).replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var b=atob(t),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function devId(){
  var k='gn-device',v=null;
  try{v=localStorage.getItem(k)}catch(e){}
  if(!v||!/^[A-Z2-9]{8}$/.test(v)){
    var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint8Array(8);v='';
    if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(var i=0;i<8;i++)a[i]=Math.floor(Math.random()*256);
    for(var j=0;j<8;j++)v+=A.charAt(a[j]%A.length);
    try{localStorage.setItem(k,v)}catch(e){}
  }
  return v;
}
function devShow(){var v=devId();return v.slice(0,4)+'-'+v.slice(4)}
async function checkCode(code){
  try{
    var pub=window.GN_PUB||'';
    if(!pub) return {err:'nokey'};
    if(!(window.crypto&&crypto.subtle)) return {err:'nocrypto'};
    var p=String(code).replace(/\s+/g,'').split('.');
    if(p.length!==2||!p[0]||!p[1]) return {err:'bad'};
    var key=await crypto.subtle.importKey('raw',b64u(pub),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    var ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64u(p[1]),b64u(p[0]));
    if(!ok) return {err:'bad'};
    var j=JSON.parse(new TextDecoder().decode(b64u(p[0])));
    if(!j||j.v!==1||!/^\d{4}-\d{2}-\d{2}$/.test(j.e)) return {err:'bad'};
    if(j.d!=='*'&&j.d!==devId()) return {err:'device'};
    return {until:j.e,name:typeof j.n==='string'?j.n:''};
  }catch(e){return {err:'bad'}}
}
async function applyLicense(){
  var u=LIC.expiry,nm='';
  if(S.license.code){var r=await checkCode(S.license.code);if(r.until){if(r.until>u)u=r.until;nm=r.name}}
  S.license.until=u;S.license.name=nm;
}
async function doCode(which){
  var inp=$(which==='unlock'?'#u-pw':'#r-pw'),err=$(which==='unlock'?'#u-err':'#r-err');
  var say=function(t){err.textContent=t;err.hidden=false};
  var code=String(inp.value).replace(/\s+/g,''),r=await checkCode(code);

    if(r.until<=S.license.until){say('Ce code est valable, mais il ne prolonge pas la date actuelle ('+fmtDate(S.license.until)+').');return}
    S.license.code=code;S.license.until=r.until;S.license.name=r.name;S.license.lastSeen=effToday();

function getNote(sid,subId,p){
  if(p==='A'){
    var v=[1,2,3].map(function(t){return S.grades[t+'|'+sid+'|'+subId]}).filter(isNum);
    return v.length?v.reduce(function(a,b){return a+b},0)/v.length:null;
  }
  var g=S.grades[p+'|'+sid+'|'+subId]; return isNum(g)?g:null;
}
function compute(p){
  var outOf=10;
  var rows=S.students.map(function(s){
    var sum=0,den=0,total=0,max=0,got=0,maxGot=0;
    var items=S.subjects.map(function(sub){
      var note=getNote(s.id,sub.id,p);
      max+=sub.bareme;
      if(note!=null){maxGot+=sub.bareme;total+=note;got++}
      return {sub:sub,note:note,pts:note,max:sub.bareme};
    });
    return {s:s,items:items,total:total,max:max,avg:maxGot?total/(maxGot/outOf):null,got:got,missing:S.subjects.length-got,rank:null,tie:false};
  });
  if(p==='A'){var TT=[1,2,3].map(function(q){return compute(q)});rows.forEach(function(r,i){var v=TT.map(function(t){return t.rows[i].avg}).filter(isNum);r.avg=v.length?v.reduce(function(a,b){return a+b},0)/v.length:null})}
  var key=function(r){return Math.round(r.avg*100)};
  var ranked=rows.filter(function(r){return r.avg!=null});
  ranked.forEach(function(r){
    r.rank=1+ranked.filter(function(o){return key(o)>key(r)}).length;
    r.tie=ranked.some(function(o){return o!==r&&key(o)===key(r)});
  });
  var a=ranked.map(function(r){return r.avg});
  var stats={n:S.students.length,mean:a.length?a.reduce(function(x,y){return x+y},0)/a.length:null,max:a.length?Math.max.apply(null,a):null,min:a.length?Math.min.apply(null,a):null,pass:a.length?a.filter(function(v){return v>=outOf/2}).length/a.length:null};
  return {rows:rows,stats:stats,outOf:outOf};
}
function appreciation(avg,outOf){
  if(avg==null) return '–';
  var r=avg/outOf;
  return r>=.8?'Très bien':r>=.7?'Bien':r>=.6?'Assez bien':r>=.5?'Passable':r>=.4?'Insuffisant':'Faible';
}
function rankStr(r){return r.rank==null?'–':(r.rank===1?'1er':r.rank+'e')+(r.tie?' ex æquo':'')}

function successStats(p){
  var C=compute(p),mk=function(){return {F:[0,0],M:[0,0],T:[0,0]}};
  var add=function(o,sex,ok){var a=[o.T];if(sex==='F')a.push(o.F);else if(sex==='M')a.push(o.M);a.forEach(function(c){c[0]++;if(ok)c[1]++})};
  var rows=S.subjects.map(function(sub,i){var o=mk();C.rows.forEach(function(r){var n=r.items[i].note;if(n!=null)add(o,r.s.sex,n>=sub.bareme/2)});return {name:sub.name,bareme:sub.bareme,o:o}});
  var g=mk();C.rows.forEach(function(r){if(r.avg!=null)add(g,r.s.sex,r.avg>=C.outOf/2)});
  rows.push({name:'Moyenne générale',bareme:C.outOf,o:g,gen:true});
  return {rows:rows,outOf:C.outOf,nosex:S.students.filter(function(x){return x.sex!=='F'&&x.sex!=='M'}).length};
}

function bilanData(){
  var T=[1,2,3].map(function(q){return compute(q)}),G=compute('A');
  var out=sortedStudents().map(function(s){
    var pick=function(C){return C.rows.filter(function(r){return r.s.id===s.id})[0]};
    var g=pick(G);return {s:s,t:T.map(function(C){return pick(C).avg}),g:g.avg,rk:rankStr(g),r:g.rank};
  });
  out.sort(function(a,b){return ((a.r==null)-(b.r==null))||(a.r-b.r)||a.s.name.localeCompare(b.s.name,'fr')});
  out.forEach(function(d,i){d.n=i+1});
  return out;
}

      if(i===1||i===13)doc.text(fit(doc,t,cw[i]-3),x+2,y+rh*0.7);else doc.text(fit(doc,t,cw[i]-1),x+cw[i]/2,y+rh*0.7,{align:'center'});
      x+=cw[i];
    });
    doc.setDrawColor(190);doc.setLineWidth(.2);doc.line(M,y+rh,M+tw,y+rh);y+=rh;
  });
  bg();doc.setTextColor(20);
  y+=5;if(y>168){doc.addPage();y=25}
  doc.setTextColor(20);
  doc.setFont('helvetica','normal');doc.setFontSize(12);doc.text(pdfText(faitLe()),W-M,y,{align:'right'});y+=9;
  var dsx=S.school.directorSex==='F'?'La Directrice':'Le Directeur';
  [['Le conseil des professeurs',''],[dsx,S.school.director],["Décision du Chef de Circonscription d'Éducation de Base",'']].forEach(function(a,i){
    var x=M+i*((W-2*M)/3),mw=(W-2*M)/3-6,ln=[],cur='';doc.setFont('helvetica','bold');
    pdfText(a[0]).split(' ').forEach(function(w){var t=cur?cur+' '+w:w;if(cur&&doc.getTextWidth(t)>mw){ln.push(cur);cur=w}else cur=t});
    if(cur)ln.push(cur);ln.forEach(function(l,k){doc.text(l,x,y+k*5.5)});
    doc.setFont('helvetica','normal');if(a[1])doc.text(fit(doc,pdfText(a[1]),80),x,y+24);
  });
  return doc;
}
function pdfRank(){savePdf(buildRank,'classement-'+(ui.rp==='A'?'annee':'t'+ui.rp)+'-'+slug(S.school.classe||'classe')+'.pdf')}
function buildRank(K){
  var C=compute(ui.rp),doc=new K({unit:'mm',format:'a4',orientation:'landscape'});
  var rows=C.rows.slice().sort(function(a,b){return ((a.rank==null)-(b.rank==null))||(a.rank-b.rank)||a.s.name.localeCompare(b.s.name,'fr')});
  var M=8,W=297,subs=S.subjects,fx=[12,46,14,20,27],fixed=fx.reduce(function(a,b){return a+b},0);
  doc.setFont('helvetica','normal');doc.setFontSize(12);
  var avail=W-2*M-fixed,dsh=function(t){return pdfText(t).replace(/-/g,'- ')};
  var mw=subs.map(function(s){return Math.max.apply(null,dsh(s.name).split(' ').concat(['/'+s.bareme]).map(function(t){return doc.getTextWidth(t)}))+2.5}),NN=mw.reduce(function(a,b){return a+b},0);
  var sws=mw.map(function(w){return NN<=avail?w+(avail-NN)/Math.max(1,subs.length):w*avail/NN});
  var cols=[['Rang',fx[0],'c'],['Élève',fx[1],'l']].concat(subs.map(function(s,i){return [s.name,sws[i],'c',s]})).concat([['Total',fx[2],'c'],['Moyenne',fx[3],'c'],['Appréciation',fx[4],'l']]);
  var tw=cols.reduce(function(a,c){return a+c[1]},0),y=0,rh=5.6,lh=5.2,gridTop=0;
  doc.setFont('helvetica','bold');doc.setFontSize(12);
  doc.setFont('helvetica','normal');
  var lines=cols.map(function(c){return c[3]?wrapN(doc,dsh(c[0]),c[1]-1.5).slice(0,3).map(function(l){return l.replace(/- /g,'-')}).concat(['/'+c[3].bareme]):[pdfText(c[0])]});
  var hh=lh*lines.reduce(function(a,l){return Math.max(a,l.length)},1)+2;
  var head=function(){
    y=drawTop(doc,W,M,110,true)+8;doc.setTextColor(20);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('CLASSEMENT',W/2,y,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(12);doc.text(pdfText(TL[ui.rp]+' - Moyennes sur '+C.outOf),W/2,y+6,{align:'center'});
    y+=10;gridTop=y;doc.setFillColor(232,236,246);doc.rect(M,y,tw,hh,'F');
    var x=M;doc.setFont('helvetica','normal');doc.setFontSize(12);
    cols.forEach(function(c,i){
      var L=lines[i];
      if(c[3]){doc.setFont('helvetica','normal');L.forEach(function(t,j){doc.text(t,x+c[1]/2,y+4.8+j*lh,{align:'center'})})}
      else if(c[2]==='l') doc.text(fit(doc,L[0],c[1]-2),x+2,y+hh/2+1.6);
      else doc.text(fit(doc,L[0],c[1]-1),x+c[1]/2,y+hh/2+1.6,{align:'center'});
      x+=c[1];
    });
    y+=hh;
  };
  head();
  rows.forEach(function(r){
    if(y+rh>196){pdfGrid(doc,M,cols.map(function(c){return c[1]}),gridTop,y,null,gridTop+hh);doc.addPage();head()}
    var cells=[rankStr(r),r.s.name].concat(r.items.map(function(it){return it.note==null?'-':fn(it.note)})).concat([r.got?fn(r.total):'-',f2(r.avg),appreciation(r.avg,C.outOf)]);
    var x=M;doc.setFontSize(12);
    if(r.s.sex==='F')doc.setTextColor(196,48,43);else doc.setTextColor(20);
    cols.forEach(function(c,i){
      var t=pdfText(cells[i]).replace('–','-');
      doc.setFont('helvetica',i===cols.length-2?'bold':'normal');
      if(c[2]==='l') doc.text(fit(doc,t,c[1]-3),x+2,y+rh*0.7);else doc.text(fit(doc,t,c[1]-1),x+c[1]/2,y+rh*0.7,{align:'center'});
      x+=c[1];
    });
    doc.setDrawColor(190);doc.setLineWidth(.2);doc.line(M,y+rh,M+tw,y+rh);y+=rh;
  });
  pdfGrid(doc,M,cols.map(function(c){return c[1]}),gridTop,y,null,gridTop+hh);
  drawSigs(doc,y+1,W,M);
  return doc;
}

/* Exemple de classe */
function loadExample(){
  var seed=7;var rnd=function(){seed=(seed*16807)%2147483647;return seed/2147483647};
  var names=[['Awa Ouédraogo','F',9],['Ibrahim Sawadogo','M',10],['Fatimata Zongo','F',9],['Moussa Kaboré','M',10],['Salamata Compaoré','F',9],['Abdoul Traoré','M',11],['Mariam Sankara','F',10],['Boureima Kiemdé','M',9],['Rasmata Ilboudo','F',10],['Souleymane Tapsoba','M',10],['Aminata Nikièma','F',9],['Daouda Belem','M',11]];
  var subs=[['Dictée',2,10],['Lecture',2,10],['Rédaction',2,10],['Calcul',3,20],['Problèmes',2,10],["Sciences d'observation",1,10],['Histoire-Géographie',1,10],['Éducation civique et morale',1,10]];
  var d=defaultState();d.license=S.license;d.example=true;d.school.name='École primaire (exemple)';d.school.classe='CM1';
  d.students=names.map(function(n){return {id:uid(),name:n[0],sex:n[1],age:n[2],ab:0.35+rnd()*0.6}});
  d.subjects=subs.map(function(s){return {id:uid(),name:s[0],bareme:s[2]}});
  [1,2].forEach(function(t){d.students.forEach(function(s){d.subjects.forEach(function(sub){
    var v=(s.ab+(rnd()-.5)*.3+(t===2?.04:0))*sub.bareme;v=Math.max(0,Math.min(sub.bareme,Math.round(v*2)/2));d.grades[t+'|'+s.id+'|'+sub.id]=v})})});
  d.students.forEach(function(s){delete s.ab});
  S=d;ui.sub=null;ui.bs=null;touch();render();
}

/* Rendu */
function render(){
  var m=$('#main');
  if(!S){return}
  if(isLocked()){renderLock(m);return}
  $('#tabs').style.display='';
  $('#circ').textContent=CIRC;
  $('#schoolTitle').textContent=S.school.name?schoolLine(S.school.name):'GESTION DES NOTES';
  $('#classTitle').textContent=[S.school.classe,S.school.year].filter(Boolean).join(' · ');
  $('#tabs').innerHTML=TABS.map(function(t){return '<button type="button" data-tab="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+svg(t[0])+'<span>'+t[1]+'</span></button>'}).join('');
  m.innerHTML=soonBanner()+({eleves:viewEleves,disciplines:viewDisciplines,notes:viewNotes,resultats:viewResultats,bulletins:viewBulletins,bilan:viewBilan,accueil:viewAccueil})[ui.tab]();
  if(ui.tab==='notes'){var p=$('#prog');if(p)p.innerHTML=progText()}
}
function go(tab){ui.tab=tab;render();window.scrollTo(0,0)}

/* Événements */
function arm(btn){
  btn.classList.add('armed');btn.dataset.html=btn.innerHTML;btn.textContent='Confirmer ?';
  clearTimeout(btn._t);btn._t=setTimeout(function(){if(btn.isConnected){btn.classList.remove('armed');btn.innerHTML=btn.dataset.html}},3000);
}
document.addEventListener('click',function(e){
  var tb=e.target.closest('[data-tab]');if(tb&&S){go(tb.dataset.tab);return}
  if(!S) return;
  var b=e.target.closest('[data-act]');if(!b) return;
  if(b.hasAttribute('data-confirm')&&!b.classList.contains('armed')){arm(b);return}
  var act=b.dataset.act,row=b.closest('[data-id]');
  if(act==='np'){ui.np=Number(b.dataset.p);render()}
  else if(act==='rp'){ui.rp=b.dataset.p==='A'?'A':Number(b.dataset.p);render()}
  else if(act==='go'){go(b.dataset.t)}
  else if(act==='load-example'){loadExample()}
  else if(act==='clear-example'){var lic=S.license;S=defaultState();S.license=lic;ui.sub=null;ui.bs=null;touch();render()}
  else if(act==='focus-add'){var a=$('#a-name');if(a){a.scrollIntoView({block:'center'});a.focus()}}
  else if(act==='del-student'){var id=row.dataset.id;S.students=S.students.filter(function(s){return s.id!==id});Object.keys(S.grades).forEach(function(k){if(k.split('|')[1]===id)delete S.grades[k]});touch();render()}
  else if(act==='del-subject'){var sid=row.dataset.id;S.subjects=S.subjects.filter(function(s){return s.id!==sid});Object.keys(S.grades).forEach(function(k){if(k.split('|')[2]===sid)delete S.grades[k]});touch();render()}
  else if(act==='up'||act==='down'){
    var i=S.subjects.findIndex(function(s){return s.id===row.dataset.id}),j=act==='up'?i-1:i+1;
    if(j>=0&&j<S.subjects.length){var t=S.subjects[i];S.subjects[i]=S.subjects[j];S.subjects[j]=t;touch();render()}
  }
  else if(act==='bulk'){
    var ta=$('#bulk'),added=0;
    ta.value.split(/\r?\n/).forEach(function(line){
      var p=line.split(/[;\t]/).map(function(x){return x.trim()});if(!p[0]) return;
      var sx=(p[1]||'').toUpperCase(),age=parseInt(p[2],10);
      S.students.push({id:uid(),name:p[0],sex:sx[0]==='M'?'M':sx[0]==='F'?'F':'',age:isFinite(age)?age:null});added++;
    });
    if(added){touch();render();toast(added+' élève(s) ajouté(s).')}
  }
  else if(act==='prev'||act==='next'){
    var l=sortedStudents(),k=l.findIndex(function(s){return s.id===ui.bs}),n=act==='prev'?k-1:k+1;
    if(n>=0&&n<l.length){ui.bs=l[n].id;render()}
  }
  else if(act==='close-pages'){$('#pages').hidden=true}
  else if(act==='backup'){doBackup()}
  else if(act==='restore'){var rf=$('#restoreFile');if(rf){rf.value='';rf.click()}}
  else if(act==='pdf-one'){pdfOne()}
  else if(act==='pdf-all'){pdfAll()}
  else if(act==='pdf-rank'){pdfRank()}
  else if(act==='pdf-bilan'){pdfBilan()}
  else if(act==='pdf-succ'){pdfSucc()}
});
document.addEventListener('submit',function(e){
  e.preventDefault();if(!S) return;
  if(e.target.id==='unlock'||e.target.id==='renew'){doCode(e.target.id);return}
  if(e.target.id==='addStudent'){
    var nm=$('#a-name').value.trim();if(!nm) return;
    var age=parseInt($('#a-age').value,10);
    S.students.push({id:uid(),name:nm,sex:$('#a-sex').value,age:isFinite(age)?age:null});touch();render();$('#a-name').focus();
  } else if(e.target.id==='addSubject'){
    var dn=$('#d-name').value.trim();if(!dn) return;
    
    S.subjects.push({id:uid(),name:dn,bareme:Number($('#d-bareme').value)===20?20:10});touch();render();$('#d-name').focus();
  }
});
document.addEventListener('input',function(e){
  if(!S) return;var t=e.target;
  if(t.dataset.school){
    var k=t.dataset.school;S.school[k]=k==='outOf'?(Number(t.value)===10?10:20):t.value;
    if(k==='passAvg')document.querySelectorAll('[data-gen]').forEach(function(el){var g=el.dataset.gen;el.textContent=propText(g===''?null:Number(g),el.dataset.sex)});
    $('#schoolTitle').textContent=S.school.name?schoolLine(S.school.name):'GESTION DES NOTES';
    $('#classTitle').textContent=[S.school.classe,S.school.year].filter(Boolean).join(' · ');touch();return;
  }
  if(t.dataset.bf){var bs=S.students.filter(function(x){return x.id===t.closest('[data-id]').dataset.id})[0];if(bs){bs[t.dataset.bf]=t.value;touch()}return}
  var row=t.closest('.srow');
  if(row&&t.dataset.f){
    var s=S.students.filter(function(x){return x.id===row.dataset.id})[0];if(!s) return;
    if(t.dataset.f==='name'){if(t.value.trim()) s.name=t.value.trim()}
    else if(t.dataset.f==='age'){var a=parseInt(t.value,10);s.age=isFinite(a)?a:null}
    else{s.sex=t.value;row.classList.toggle('girl',t.value==='F');var ef=$('#effLine');if(ef)ef.innerHTML='<b>Effectif</b> — '+effText()}
    touch();return;
  }
  var dr=t.closest('.drow');
  if(dr&&t.dataset.f){
    var sb=S.subjects.filter(function(x){return x.id===dr.dataset.id})[0];if(!sb) return;
    if(t.dataset.f==='name'){if(t.value.trim()) sb.name=t.value.trim()}
    else if(t.dataset.f==='bareme'){
      var nb=Number(t.value)===20?20:10;
      if(nb!==sb.bareme){
        var over=Object.keys(S.grades).filter(function(k){return k.split('|')[2]===sb.id&&S.grades[k]>nb});
        over.forEach(function(k){delete S.grades[k]});
        sb.bareme=nb;if(over.length) toast(over.length+' note(s) dépassaient le nouveau barème et ont été retirées.');
      }
    }
    touch();return;
  }
  if(t.classList.contains('note-in')){
    var sub=S.subjects.filter(function(x){return x.id===ui.sub})[0],rw=t.closest('.noterow');
    var raw=t.value.trim().replace(',','.'),key=ui.np+'|'+rw.dataset.s+'|'+sub.id;
    if(raw===''){delete S.grades[key];rw.classList.remove('bad')}
    else{var v=Number(raw);
      if(isFinite(v)&&v>=0&&v<=sub.bareme){S.grades[key]=Math.round(v*100)/100;rw.classList.remove('bad')}
      else{rw.classList.add('bad');return}}
    $('#prog').innerHTML=progText();touch();
  }
});
document.addEventListener('change',function(e){
  if(!S) return;var t=e.target;
  if(t.id==='n-sub'){ui.sub=t.value;render()}
  else if(t.id==='b-stu'){ui.bs=t.value;render()}
  else if(t.classList&&t.classList.contains('note-in')){
    var rw=t.closest('.noterow'),g=S.grades[ui.np+'|'+rw.dataset.s+'|'+ui.sub];t.value=isNum(g)?fn(g):'';rw.classList.remove('bad');
  }
  else if(t.dataset&&t.dataset.f==='bareme'){render()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('note-in')){
    e.preventDefault();var all=[].slice.call(document.querySelectorAll('.note-in')),i=all.indexOf(e.target);
    if(all[i+1]){all[i+1].focus();all[i+1].select()}else e.target.blur();
  }
});

/* Démarrage */
(async function(){
  var h=(location.hash||'').slice(1);if(TABS.some(function(t){return t[0]===h})) ui.tab=h;
  setStatus('loading');
  try{
    if(window.claude&&window.claude.use){
      var db=await window.claude.use('db');
      dl=await window.claude.use('downloads');
      if(db){
        dbDoc=db.doc('app/state');
        var snap=await dbDoc.get();
        if(snap.exists&&snap.data()&&snap.data().json){S=normalize(JSON.parse(snap.data().json));setStatus('saved')}
        else{var loc=localLoad();S=normalize(loc);setStatus('saved');if(loc) touch()}
      }
    }
  }catch(e){dbDoc=null}
  if(!S){S=normalize(localLoad());setStatus(dbDoc?'saved':'local')}
  await applyLicense();
  if(S.license.lastSeen!==effToday()){S.license.lastSeen=effToday();touch()}
  render();
})();
})();
